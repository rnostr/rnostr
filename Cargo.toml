[package]
name = "rnostr"
version = "0.4.9"
description = "A high-performance and scalable nostr relay."
keywords = ["nostr", "nostr-relay"]
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
path = "src/main.rs"
name = "rnostr"

[dependencies]
actix-rt = "2.10.0"
anyhow = "1.0.86"
clap = { version = "4.5.16", features = ["derive"] }
clio = { version = "0.3.5", features = ["clap-parse"] }
indicatif = "0.17.8"
nostr-db = { version = "0.4.5", path = "./db", default-features = false, features = ["search"] }
nostr-relay = { version = "0.4.9", path = "./relay", default-features = false, features = ["search"] }
nostr-extensions = { version = "0.4.9", path = "./extensions", default-features = false, features = [
    "metrics",
    "rate_limiter",
    "count",
    "search",
] }
rayon = "1.10.0"
thiserror = "1.0.63"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

[features]
default = ["search-japanese", "search-korean"]
search-japanese = [
    "nostr-db/search-japanese",
    "nostr-relay/search-japanese",
    "nostr-extensions/search-japanese",
]
search-korean = [
    "nostr-db/search-korean",
    "nostr-relay/search-korean",
    "nostr-extensions/search-korean",
]

[workspace]

members = ["kv", "kv/bench", "db", "db/bench", "relay", "extensions"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/rnostr"
repository = "https://github.com/rnostr/rnostr.git"
authors = ["Arron zhang <arronzhang@me.com>"]
